[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "license-activation-cli"
version = "0.1.0.0"
description = "Interactive Windows CLI for license activation"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<1",
  "cryptography>=44,<48",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pyinstaller>=6.11,<7",
]

[tool.setuptools.packages.find]
include = ["license_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
